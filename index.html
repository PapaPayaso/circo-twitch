<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
body,html{margin:0;padding:0;overflow:hidden;background:transparent;width:100vw;height:100vh;}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}
</style></head><body><canvas id="cv"></canvas><script>
const canal='papapayaso', canvas=document.getElementById('cv'), ctx=canvas.getContext('2d');
const avatares={}, particulas=[]; let exclusivoSalió=false;
function aj(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
aj(); window.addEventListener('resize',aj);

class Particula{
 constructor(x,y,col){this.x=x;this.y=y;this.col=col;this.vx=(Math.random()-0.5)*6;this.vy=(Math.random()-0.8)*8;this.alfa=1;}
 act(){this.x+=this.vx;this.vy+=0.25;this.y+=this.vy;this.alfa-=0.02;}
 dib(){ctx.save();ctx.globalAlpha=this.alfa;ctx.fillStyle=this.col;ctx.fillRect(this.x,this.y,3,3);ctx.restore();}
}

class PayasoGacha{
 constructor(id,nombre){
  this.id=id;this.nombre=nombre;this.x=Math.random()*(canvas.width-60);this.y=canvas.height-85;
  this.velX=(Math.random()*0.6+0.4)*(Math.random()>0.5?1:-1);this.jumpY=0;this.velY=0;this.enSuelo=true;
  this.timerVida=Date.now();this.explotando=false;this.f=0;this.tAnim=0;
  
  let r=Math.random()*100;
  if(r<=1&&!exclusivoSalió){exclusivoSalió=true;this.rar='👑 SUPREMO';this.col='#ffd700';}
  else if(r>1&&r<=6){this.rar='🔮 ÉPICO';this.col='#a335ee';}
  else if(r>6&&r<=26){this.rar='⭐ RARO';this.col='#0070dd';}
  else{this.rar='🎪 COMÚN';this.col='#9146ff';}
 }
 act(){
  if(this.explotando)return; this.x+=this.velX;
  if(this.x<0||this.x>canvas.width-50)this.velX*=-1;
  if(!this.enSuelo){this.jumpY+=this.velY;this.velY-=0.4;if(this.jumpY<=0){this.jumpY=0;this.enSuelo=true;}}
  if(Date.now()>this.tAnim){this.tAnim=Date.now()+130;this.f=(this.f+1)%4;}
 }
 dib(){
  if(this.explotando)return; const px=this.x,py=this.y-this.jumpY;
  ctx.save();
  ctx.shadowBlur=this.rar!=='🎪 COMÚN'?15:0;ctx.shadowColor=this.col;
  ctx.fillStyle=this.col;ctx.fillRect(px+8,py+16,32,24);ctx.fillStyle='#111';ctx.fillRect(px+12,py+4,24,14);
  ctx.fillStyle='#fff';ctx.fillRect(px+16,py+8,4,4);ctx.fillRect(px+26,py+8,4,4);
  let op=Math.abs(this.velX)>0.1?Math.sin(Date.now()*0.015)*4:0;
  ctx.fillStyle='#333';ctx.fillRect(px+14,py+40,6,8+op);ctx.fillRect(px+28,py+40,6,8-op);
  ctx.restore();
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.8)';ctx.font='bold 11px sans-serif';
  let t=`${this.nombre} [${this.rar}]`;ctx.fillRect(px+24-ctx.measureText(t).width/2-4,py-22,ctx.measureText(t).width+8,18);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(t,px+24,py-9);ctx.restore();
 }
 saltar(){if(this.enSuelo&&!this.explotando){this.velY=8;this.enSuelo=false;}}
 explotar(){
  this.explotando=true;
  for(let i=0;i<40;i++)particulas.push(new Particula(this.x+24,this.y+20-this.jumpY,this.col));
 }
}

function bucle(){
 ctx.clearRect(0,0,canvas.width,canvas.height); const ahora=Date.now();
 for(let id in avatares){
  const av=avatares[id];
  if(ahora-av.timerVida>30000&&!av.explotando){av.explotar();setTimeout(()=>{delete avatares[id];},50);continue;}
  av.act();av.dib();
 }
 for(let i=particulas.length-1;i>=0;i--){particulas[i].act();particulas[i].dib();if(particulas[i].alfa<=0)particulas.splice(i,1);}
 requestAnimationFrame(bucle);
}
bucle();

const ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
ws.onopen=()=>{
 ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands\r\n');ws.send('PASS anonymous\r\n');
 ws.send('NICK justinfan12984\r\n');ws.send(`JOIN #${canal}\r\n`);
};
ws.onmessage=(ev)=>{
 const msg=ev.data;
 if(msg.includes('PRIVMSG')){
  const displayMatch=msg.match(/display-name=([^;]+)/),userIdMatch=msg.match(/user-id=(\d+)/);
  const usuario=displayMatch?displayMatch[1]:'Espectador',idUsuario=userIdMatch?userIdMatch[1]:usuario;
  if(!avatares[idUsuario])avatares[idUsuario]=new PayasoGacha(idUsuario,usuario);else avatares[idUsuario].timerVida=Date.now();
  avatares[idUsuario].saltar();
 }
 if(msg.startsWith('PING'))ws.send('PONG :tmi.twitch.tv\r\n');
};
</script></body></html>
